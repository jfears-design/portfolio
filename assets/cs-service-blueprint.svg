<rect x="235" y="818" width="1600" height="87" rx="6" fill="#fff1ef"/>
<text x="255" y="849" font-family="Arial, sans-serif" font-size="23" fill="#a43129" font-weight="700">The person seeing the error may not be the person who can fix it.</text>
<text x="255" y="881" font-family="Arial, sans-serif" font-size="19" fill="#8d3b34" font-weight="400">Template failure → end user asks administrator → administrator fixes the template → end user retries.</text>
<rect x="235" y="922" width="1600" height="73" rx="6" fill="#fff4e5"/>
<text x="255" y="951" font-family="Arial, sans-serif" font-size="19" fill="#925400" font-weight="700">Redesign focus</text>
<text x="430" y="951" font-family="Arial, sans-serif" font-size="18" fill="#23354a" font-weight="400">Clearer guidance · One adaptive launch page · Earlier validation · Recovery in the launch interface</text>
<text x="255" y="978" font-family="Arial, sans-serif" font-size="16" fill="#60778b" font-weight="400">Service dependencies are context. Highlighted interface work does not imply every backend failure was removed.</text>
<text x="48" y="1032" font-family="Arial, sans-serif" font-size="16" fill="#60778b" font-weight="400">Research basis: Product Launch Summary; launch prototypes and design-review artifacts. Broader lifecycle reconstructed from project context.</text>
